name: Verify and build fnOS HStudio FPKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hstudio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, verify, and build Lite + Offline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out HStudio
        uses: actions/checkout@v4

      - name: Set up Node.js 24 for Runtime smoke tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read and validate the Runtime lock
        id: runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          manifest = json.loads(pathlib.Path("config/runtime-manifest.json").read_text(encoding="utf-8"))
          studio = manifest["studio"]
          version = str(studio["version"])
          archive = str(studio["archive"])
          commit = str(studio["upstreamCommit"]).lower()
          sha256 = str(studio["sha256"]).lower()
          source_url = str(studio["sourceUrl"])
          expected_url = (
              "https://github.com/EKKOLearnAI/hermes-studio/releases/download/"
              f"v{version}/hermes-web-ui-{version}.tar.gz"
          )
          expected_archive = f"hermes-studio-runtime-{version}-linux-x64.tar.gz"

          assert studio["upstreamRepository"] == "https://github.com/EKKOLearnAI/hermes-studio"
          assert studio["upstreamTag"] == f"v{version}"
          assert source_url == expected_url
          assert archive == expected_archive
          assert re.fullmatch(r"[0-9a-f]{40}", commit)
          assert re.fullmatch(r"[0-9a-f]{64}", sha256)
          assert int(studio["size"]) > 0

          package_version = next(
              line.split("=", 1)[1].strip().strip('"')
              for line in pathlib.Path("manifest").read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("version")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"archive={archive}\n")
              output.write(f"commit={commit}\n")
              output.write(f"package_version={package_version}\n")
              output.write(f"sha256={sha256}\n")
              output.write(f"size={int(studio['size'])}\n")
              output.write(f"source_url={source_url}\n")
          PY

      - name: Check out the authoritative Hermes Studio commit
        uses: actions/checkout@v4
        with:
          repository: EKKOLearnAI/hermes-studio
          ref: ${{ steps.runtime.outputs.commit }}
          path: hermes-studio-upstream-authoritative
          persist-credentials: false

      - name: Download the locked official Runtime archive
        env:
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
          RUNTIME_URL: ${{ steps.runtime.outputs.source_url }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-runtime
          curl \
            --fail --location --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 5 \
            --connect-timeout 20 --max-time 1200 \
            --output ".ci-runtime/${RUNTIME_ARCHIVE}.part" \
            "$RUNTIME_URL"
          mv ".ci-runtime/${RUNTIME_ARCHIVE}.part" ".ci-runtime/${RUNTIME_ARCHIVE}"

      - name: Verify Runtime size and SHA256
        env:
          EXPECTED_SHA256: ${{ steps.runtime.outputs.sha256 }}
          EXPECTED_SIZE: ${{ steps.runtime.outputs.size }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_path=".ci-runtime/${RUNTIME_ARCHIVE}"
          actual_size="$(stat --format=%s "$runtime_path")"
          test "$actual_size" = "$EXPECTED_SIZE" || {
            echo "Runtime size mismatch: expected=${EXPECTED_SIZE} actual=${actual_size}" >&2
            exit 1
          }
          printf '%s  %s\n' "$EXPECTED_SHA256" "$runtime_path" | sha256sum --check --strict -

      - name: Check shell syntax and ShellCheck findings
        shell: bash
        run: |
          set -euo pipefail
          shell_files=(
            cmd/main
            cmd/*_init
            cmd/*_callback
            cmd/lib/*.sh
            app/bin/hermes-web-ui
            tests/*.sh
            .agents/skills/trim-cli/scripts/trim-cli
          )
          bash -n "${shell_files[@]}"
          # Sourced libraries intentionally define cross-file globals, and the
          # POSIX trim-cli wrapper intentionally uses an empty CDPATH command env.
          shellcheck \
            --external-sources \
            --severity=warning \
            --exclude=SC1007,SC1090,SC1091,SC2034,SC2154 \
            "${shell_files[@]}"

      - name: Run all Python, shell, and Manager tests
        env:
          HERMES_STUDIO_UPSTREAM: ${{ github.workspace }}/hermes-studio-upstream-authoritative
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.py; do
            python3 "$test"
          done
          for test in tests/test-*.sh; do
            bash "$test"
          done
          for test in tests/test-*.mjs; do
            node --test "$test"
          done

      - name: Evaluate redistribution license gate
        id: license
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          metadata = json.loads(pathlib.Path("config/runtime-manifest.json").read_text(encoding="utf-8"))
          statuses = {
              "Hermes Studio Runtime": metadata["studio"].get("licenseStatus"),
              "trim-cli": metadata["trimCli"].get("licenseStatus"),
          }
          accepted = {"license-review-required", "redistribution-approved"}
          unexpected = {name: value for name, value in statuses.items() if value not in accepted}
          if unexpected:
              raise SystemExit(f"Unexpected license status: {unexpected}")
          blocked = not all(value == "redistribution-approved" for value in statuses.values())
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"redistribution_approved={'false' if blocked else 'true'}\n")
          if blocked:
              print("::warning title=Artifact publication blocked::Third-party redistribution approval is incomplete.")
          PY
          echo "This workflow has read-only contents permission and cannot create a GitHub Release."

      - name: Build verified Lite and Offline FPKs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNTIME_ARCHIVE: ${{ steps.runtime.outputs.archive }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-thin-fpk.py \
            --variant lite \
            --output-dir artifacts
          python3 scripts/build-thin-fpk.py \
            --variant offline \
            --runtime-archive ".ci-runtime/${RUNTIME_ARCHIVE}" \
            --output-dir artifacts

      - name: Verify FPK checksums and exact output set
        env:
          PACKAGE_VERSION: ${{ steps.runtime.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          lite="artifacts/fnos-HStudio-lite-v${PACKAGE_VERSION}.fpk"
          offline="artifacts/fnos-HStudio-offline-v${PACKAGE_VERSION}.fpk"
          test -f "$lite" && test -f "$offline"
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.fpk' -print)
          test "${#packages[@]}" -eq 2 || {
            printf 'Unexpected FPK output: %s\n' "${packages[*]}" >&2
            exit 1
          }
          (cd artifacts && sha256sum --check --strict fnos-HStudio-*.fpk.sha256)

      - name: Upload redistribution-approved FPK artifacts
        if: steps.license.outputs.redistribution_approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fnos-HStudio-${{ steps.runtime.outputs.package_version }}-CI-only
          path: |
            artifacts/fnos-HStudio-*.fpk
            artifacts/fnos-HStudio-*.fpk.sha256
            artifacts/ARTIFACTS.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
