name: Verify and build fnOS HStudio FPK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hstudio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, verify, and build FPK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out HStudio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 24 for Manager and Runtime tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Read and validate the Runtime lock
        id: runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          manifest = json.loads(pathlib.Path("config/runtime-manifest.json").read_text(encoding="utf-8"))
          studio = manifest["studio"]
          version = str(studio["version"])
          archive = str(studio["archive"])
          commit = str(studio["upstreamCommit"]).lower()
          sha256 = str(studio["sha256"]).lower()
          source_url = str(studio["sourceUrl"])
          expected_url = (
              "https://github.com/EKKOLearnAI/hermes-studio/releases/download/"
              f"v{version}/hermes-web-ui-{version}.tar.gz"
          )
          expected_archive = f"hermes-studio-runtime-{version}-linux-x64.tar.gz"

          assert studio["upstreamRepository"] == "https://github.com/EKKOLearnAI/hermes-studio"
          assert studio["upstreamTag"] == f"v{version}"
          assert source_url == expected_url
          assert archive == expected_archive
          assert re.fullmatch(r"[0-9a-f]{40}", commit)
          assert re.fullmatch(r"[0-9a-f]{64}", sha256)
          assert int(studio["size"]) > 0

          package_version = next(
              line.split("=", 1)[1].strip().strip('"')
              for line in pathlib.Path("manifest").read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("version")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_version={package_version}\n")
          PY

      - name: Check shell syntax and ShellCheck findings
        shell: bash
        run: |
          set -euo pipefail
          shell_files=(
            cmd/main
            cmd/*_init
            cmd/*_callback
            cmd/lib/*.sh
            app/bin/hermes-web-ui
            tests/*.sh
            .agents/skills/trim-cli/scripts/trim-cli
          )
          bash -n "${shell_files[@]}"
          # Sourced libraries intentionally define cross-file globals, and the
          # POSIX trim-cli wrapper intentionally uses an empty CDPATH command env.
          shellcheck \
            --external-sources \
            --severity=warning \
            --exclude=SC1007,SC1090,SC1091,SC2034,SC2154 \
            "${shell_files[@]}"

      - name: Run fast Python, shell, and Manager tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.py; do
            python3 "$test"
          done
          for test in tests/test-*.sh; do
            bash "$test"
          done
          for test in tests/test-*.mjs; do
            node --test "$test"
          done

      - name: Evaluate redistribution license gate
        id: license
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          metadata = json.loads(pathlib.Path("config/runtime-manifest.json").read_text(encoding="utf-8"))
          trim_status = metadata["trimCli"].get("licenseStatus")
          lite_approved = trim_status == "redistribution-approved"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"lite_approved={str(lite_approved).lower()}\n")
          if not lite_approved:
              print("::warning title=Lite publication blocked::trim-cli redistribution approval is incomplete.")
          PY
          echo "This workflow has read-only contents permission and cannot create a GitHub Release."

      - name: Build verified Lite FPK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-thin-fpk.py --output-dir artifacts

      - name: Verify Lite checksum and exact output set
        env:
          PACKAGE_VERSION: ${{ steps.runtime.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          lite="artifacts/fnos-HStudio-lite-v${PACKAGE_VERSION}.fpk"
          test -f "$lite"
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.fpk' -print)
          test "${#packages[@]}" -eq 1 || {
            printf 'Unexpected FPK output: %s\n' "${packages[*]}" >&2
            exit 1
          }
          (cd artifacts && sha256sum --check --strict "$(basename "$lite").sha256")

      - name: Upload redistribution-approved Lite artifact
        if: steps.license.outputs.lite_approved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fnos-HStudio-${{ steps.runtime.outputs.package_version }}-lite-CI-only
          path: |
            artifacts/fnos-HStudio-lite-*.fpk
            artifacts/fnos-HStudio-lite-*.fpk.sha256
            artifacts/ARTIFACTS.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
