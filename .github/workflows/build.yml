name: Verify and build fnOS HStudio FPK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hstudio-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Test, verify, and build FPK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      package_version: ${{ steps.runtime.outputs.package_version }}
      release_approved: ${{ steps.license.outputs.release_approved }}
    steps:
      - name: Check out HStudio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Set up Node.js 24 for Manager and Runtime tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate official npm channel and package version
        id: runtime
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import re

          manifest = json.loads(pathlib.Path("config/runtime-manifest.json").read_text(encoding="utf-8"))
          studio = manifest["studio"]
          assert studio["package"] == "hermes-web-ui"
          assert studio["distTag"] == "latest"
          assert studio["registry"] == "https://registry.npmjs.org/"
          assert studio["upstreamRepository"] == "https://github.com/EKKOLearnAI/hermes-studio"

          package_version = next(
              line.split("=", 1)[1].strip().strip('"')
              for line in pathlib.Path("manifest").read_text(encoding="utf-8").splitlines()
              if line.strip().startswith("version")
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"package_version={package_version}\n")
          PY

      - name: Check shell syntax and ShellCheck findings
        shell: bash
        run: |
          set -euo pipefail
          shell_files=(
            cmd/main
            cmd/*_init
            cmd/*_callback
            cmd/lib/*.sh
            app/bin/hermes-web-ui
            tests/*.sh
            .agents/skills/trim-cli/scripts/trim-cli
          )
          bash -n "${shell_files[@]}"
          # Sourced libraries intentionally define cross-file globals, and the
          # POSIX trim-cli wrapper intentionally uses an empty CDPATH command env.
          shellcheck \
            --external-sources \
            --severity=warning \
            --exclude=SC1007,SC1090,SC1091,SC2034,SC2154 \
            "${shell_files[@]}"

      - name: Run fast Python, shell, and Manager tests
        shell: bash
        run: |
          set -euo pipefail
          for test in tests/test-*.py; do
            python3 "$test"
          done
          for test in tests/test-*.sh; do
            bash "$test"
          done
          for test in tests/test-*.mjs; do
            node --test "$test"
          done

      - name: Evaluate redistribution license gate
        id: license
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib

          metadata = json.loads(pathlib.Path("config/runtime-manifest.json").read_text(encoding="utf-8"))
          trim_status = metadata["trimCli"].get("licenseStatus")
          release_approved = trim_status == "redistribution-approved"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_approved={str(release_approved).lower()}\n")
          if not release_approved:
              print("::warning title=Publication blocked::trim-cli redistribution approval is incomplete.")
          PY

      - name: Build verified FPK
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-thin-fpk.py --output-dir artifacts

      - name: Verify checksum and exact output set
        env:
          PACKAGE_VERSION: ${{ steps.runtime.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          package="artifacts/fnos-HStudio-v${PACKAGE_VERSION}.fpk"
          test -f "$package"
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.fpk' -print)
          test "${#packages[@]}" -eq 1 || {
            printf 'Unexpected FPK output: %s\n' "${packages[*]}" >&2
            exit 1
          }
          (cd artifacts && sha256sum --check --strict "$(basename "$package").sha256")

      - name: Upload redistribution-approved artifact
        if: steps.license.outputs.release_approved == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fnos-HStudio-${{ steps.runtime.outputs.package_version }}
          path: |
            artifacts/fnos-HStudio-v*.fpk
            artifacts/fnos-HStudio-v*.fpk.sha256
            artifacts/ARTIFACTS.md
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish tagged FPK release
    if: startsWith(github.ref, 'refs/tags/v') && needs.verify-and-build.outputs.release_approved == 'true'
    needs: verify-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified FPK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fnos-HStudio-${{ needs.verify-and-build.outputs.package_version }}
          path: artifacts

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ needs.verify-and-build.outputs.package_version }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          expected_tag="v${PACKAGE_VERSION}"
          test "$RELEASE_TAG" = "$expected_tag" || {
            printf 'Tag %s does not match manifest version %s\n' "$RELEASE_TAG" "$PACKAGE_VERSION" >&2
            exit 1
          }
          package="artifacts/fnos-HStudio-v${PACKAGE_VERSION}.fpk"
          checksum="${package}.sha256"
          test -f "$package"
          test -f "$checksum"
          gh release create "$RELEASE_TAG" "$package" "$checksum" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "HStudio ${PACKAGE_VERSION}"
